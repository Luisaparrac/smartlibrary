spring.application.name=smartlibrary

# Base de datos H2 en memoria (se recrea en cada arranque)
spring.datasource.url=jdbc:h2:mem:smartlibrary;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Primero Hibernate crea las tablas y luego se cargan los datos de data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:smartlibrary)
spring.h2.console.enabled=true
